name: Feature Request
description: Suggest a new feature or improvement for FREE6
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["jasonzli-DEV"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! 💡
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Clearly describe the feature you'd like to see.
      placeholder: I would like FREE6 to...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Why is this needed?
      description: Explain how this feature would be used and why it's valuable.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Possible Implementation (optional)
      description: If you have ideas on how to implement this, share them here.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Moderation
        - Leveling / XP
        - Economy
        - Welcome / Goodbye
        - Reaction Roles
        - Custom Commands
        - Giveaways
        - Polls
        - Social Alerts
        - Ticketing
        - Automation
        - Web Dashboard
        - Bot Personalizer
        - New Plugin
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This feature is not currently available in FREE6
          required: true
