name: Bug Report
description: Report a bug or unexpected behavior in FREE6
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: ["jasonzli-DEV"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛
        Please fill in as much detail as possible to help us resolve the issue quickly.

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node --version`
      placeholder: e.g. v20.11.0
    validations:
      required: true

  - type: input
    id: free6-version
    attributes:
      label: FREE6 Version / Commit
      description: Version or commit hash you are running
      placeholder: e.g. v1.2.0 or abc1234
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Run the bot with ...
        2. Execute command /...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Screenshots
      description: Paste any relevant error output or attach screenshots.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have included all relevant details above
          required: true
